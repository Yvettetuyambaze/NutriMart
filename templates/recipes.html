{% extends "base.html" %}
{% block title %}NutriMart{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1><i class="fas fa-book-open" style="color: var(--accent);"></i> <span data-i18n="recipes.title">Rwandan Food Recipes</span></h1>
        <p data-i18n="recipes.subtitle">Learn about Rwandan dishes and their nutrition</p>
    </div>
</div>

<div class="container">
    <div class="recipes-grid" id="recipes-grid">
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
            <p data-i18n="recipes.loading">Loading recipes...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>document.body.dataset.i18nTitle = 'page.recipes';</script>
<script src="{{ url_for('static', filename='js/recipes.js') }}?v=2.3"></script>
{% endblock %}
