<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NutriMart{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=3.0">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
</head>
<body class="auth-page">
    <div class="auth-topbar">
        <a href="/login" class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="NutriMart" class="logo-image">
            <span class="logo-text">NutriMart</span>
        </a>
        <div class="lang-switcher">
            <button type="button" class="lang-btn" id="lang-toggle" aria-label="Change language" aria-expanded="false">
                <i class="fas fa-globe"></i>
                <span id="current-lang-label">EN</span>
                <i class="fas fa-chevron-down lang-chevron"></i>
            </button>
            <div class="lang-dropdown" id="lang-dropdown">
                <button type="button" class="lang-option" data-lang="en"><span class="lang-flag">EN</span> <span data-i18n="lang.en">English</span></button>
                <button type="button" class="lang-option" data-lang="rw"><span class="lang-flag">RW</span> <span data-i18n="lang.rw">Kinyarwanda</span></button>
                <button type="button" class="lang-option" data-lang="fr"><span class="lang-flag">FR</span> <span data-i18n="lang.fr">Français</span></button>
            </div>
        </div>
    </div>

    <main class="auth-main">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/i18n.js') }}?v=3.0"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
