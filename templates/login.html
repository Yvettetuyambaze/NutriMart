{% extends "auth_base.html" %}
{% block title %}NutriMart - Login{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-card-header">
        <div class="auth-icon"><i class="fas fa-sign-in-alt"></i></div>
        <h1 data-i18n="auth.login_title">Welcome Back</h1>
        <p data-i18n="auth.login_subtitle">Sign in to track your nutrition</p>
    </div>

    <div id="auth-error" class="auth-error hidden"></div>

    <form id="login-form" class="auth-form">
        <div class="form-group">
            <label data-i18n="auth.email_or_phone">Email or Phone</label>
            <input type="text" name="identifier" required placeholder="email@example.com or +250..." data-i18n-placeholder="auth.email_or_phone_placeholder">
        </div>
        <div class="form-group">
            <label data-i18n="auth.password">Password</label>
            <input type="password" name="password" required placeholder="••••••••" data-i18n-placeholder="auth.password_placeholder">
        </div>
        <button type="submit" class="btn btn-primary btn-lg auth-submit">
            <i class="fas fa-sign-in-alt"></i> <span data-i18n="auth.login_btn">Sign In</span>
        </button>
    </form>

    <p class="auth-switch">
        <span data-i18n="auth.no_account">Don't have an account?</span>
        <a href="/signup" data-i18n="auth.signup_link">Create one</a>
    </p>
</div>
{% endblock %}

{% block extra_scripts %}
<script>document.body.dataset.i18nTitle = 'auth.page_login';</script>
<script src="{{ url_for('static', filename='js/auth.js') }}?v=3.0"></script>
<script>initAuthForm('login-form', '/login');</script>
{% endblock %}
